<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>සුභසාධන සංගමය 2026</title>
    
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --rgb-grad: linear-gradient(45deg, #ff0000, #00ff00, #0000ff);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        /* 1. Main Title Animation (Top to Bottom) */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #fff;
            text-align: center;
        }

        .main-title {
            font-size: 4rem;
            font-weight: 800;
            background: var(--rgb-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: dropIn 1.5s ease-out forwards;
        }

        @keyframes dropIn {
            0% { transform: translateY(-200px) scale(0.5); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .scroll-indicator {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #888;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }

        /* 2. Options Section (Side Animations) */
        .options-container {
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            padding: 20px;
        }

        .option-card {
            width: 300px;
            padding: 40px;
            border-radius: 20px;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .option-card:hover { transform: scale(1.1); box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .gallery-card { color: #e91e63; border-bottom: 5px solid #e91e63; }
        .finance-card { color: #2196f3; border-bottom: 5px solid #2196f3; }

        /* 3. Image Lightbox with Blur Fade */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.5s;
        }

        .lightbox img { max-width: 85%; max-height: 85%; border-radius: 10px; box-shadow: 0 0 50px rgba(255,255,255,0.2); }

        .close-btn {
            position: absolute;
            top: 20px; right: 30px;
            font-size: 40px; color: white; cursor: pointer;
        }

        /* 4. Zoomable Finance Table */
        .table-wrap {
            overflow: auto;
            border-radius: 15px;
            background: white;
            padding: 10px;
            touch-action: pinch-zoom; /* Mobile Zoom Support */
        }

        iframe {
            width: 100%;
            height: 800px;
            border: none;
            transition: transform 0.3s ease;
        }

        .zoom-controls { margin-bottom: 10px; }

        @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }

    </style>
</head>
<body>

    <div class="hero">
        <h1 class="main-title">සුභසාධන සංගමය 2026</h1>
        <div class="scroll-indicator">පහළට ස්ක්‍රෝල් කරන්න ↓</div>
    </div>

    <div class="options-container">
        <div class="option-card gallery-card" data-aos="fade-right" onclick="scrollToSection('gallery-sec')">
            මීඩියා ගැලරිය
        </div>
        <div class="option-card finance-card" data-aos="fade-left" onclick="scrollToSection('finance-sec')">
            මුදල් තොරතුරු
        </div>
    </div>

    <div id="gallery-sec" class="container" style="padding: 50px; display:none;">
        <h2 style="text-align: center;">මීඩියා ගැලරිය</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
            <img src="WhatsApp Image 2026-05-08 at 19.16.32.jpeg" style="width: 100%; cursor: pointer;" onclick="openLightbox(this.src)">
            <img src="WhatsApp Image 2026-05-08 at 19.17.49.jpeg" style="width: 100%; cursor: pointer;" onclick="openLightbox(this.src)">
            
        
	    </div>
    </div>

    <div id="finance-sec" class="container" style="padding: 50px; display:none;">
        <h2 style="text-align: center;">මුදල් බැර කිරීම් සම්බන්ධ වගුව</h2>
        <div class="zoom-controls">
            <button onclick="zoomTable(1.2)">Zoom In +</button>
            <button onclick="zoomTable(1)">Reset</button>
            <button onclick="zoomTable(0.8)">Zoom Out -</button>
        </div>
        <div class="table-wrap" id="table-container">
            <iframe id="finance-frame" src="https://docs.google.com/spreadsheets/d/1K_VDk7w_u3vB6vj_k1inyBjxjPBT2WWkx296x9bypAg/edit?usp=sharing"></iframe>
        </div>
    </div>

    <div id="lightbox" class="lightbox">
        <span class="close-btn" onclick="closeLightbox()">&times;</span>
        <img id="lightbox-img" src="">
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();

        function scrollToSection(id) {
            document.getElementById(id).style.display = 'block';
            document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
        }

        // Lightbox Functions
        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        // Table Zooming
        let currentZoom = 1;
        function zoomTable(val) {
            currentZoom = val;
            document.getElementById('finance-frame').style.transform = `scale(${currentZoom})`;
            document.getElementById('finance-frame').style.transformOrigin = '0 0';
        }
    </script>

</body>
</html>
