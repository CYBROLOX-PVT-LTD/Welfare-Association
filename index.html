<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>සුභසාධන සංගමය 2026</title>
    
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        /* 1. Animated Liquid Gradient Background (Based on your image) */
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #ff0055, #00d2ff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Title Drop-in Animation */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .main-title {
            font-size: clamp(2rem, 8vw, 4.5rem);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.3));
            animation: dropIn 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes dropIn {
            0% { transform: translateY(-150px) scale(0.8); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* Option Cards with Side Entrance */
        .options-section {
            padding: 100px 20px;
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 280px;
            text-align: center;
            cursor: pointer;
            transition: 0.4s;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-15px) scale(1.05);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        /* HTML Table Style (Modern) */
        .table-container {
            width: 90%;
            margin: 50px auto;
            overflow-x: auto;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 20px;
            display: none; /* Hidden until clicked */
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        th { background: rgba(255, 255, 255, 0.1); color: #00d2ff; }

        /* Lightbox for Gallery */
        #lightbox {
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            display:none;
            justify-content:center;
            align-items:center;
            z-index: 9999;
        }

        #lightbox img { max-width: 90%; max-height: 80%; border-radius: 10px; }
        .close-btn { position: absolute; top: 20px; right: 40px; font-size: 50px; cursor: pointer; color: white; }

    </style>
</head>
<body>

    <div class="hero">
        <h1 class="main-title">සුභසාධන සංගමය 2026</h1>
        <p style="opacity: 0.7;">පහළට ස්ක්‍රෝල් කරන්න ↓</p>
    </div>

    <div class="options-section">
        <div class="card" data-aos="fade-right" onclick="toggleSection('gallery-view')">📷 මීඩියා ගැලරිය</div>
        <div class="card" data-aos="fade-left" onclick="fetchSheetData()">💰 මුදල් තොරතුරු</div>
    </div>

    <div id="gallery-view" class="table-container" style="display:none; text-align:center;">
        <h2>මීඩියා ගැලරිය</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
            <img src="WhatsApp Image 2026-05-08 at 19.17.49.jpeg" style="width:100%; border-radius:15px; cursor:pointer;" onclick="openLB(this.src)">
            <img src="WhatsApp Image 2026-05-08 at 19.16.32.jpeg" style="width:100%; border-radius:15px; cursor:pointer;" onclick="openLB(this.src)">
        </div>
    </div>

    <div id="finance-view" class="table-container">
        <h2 style="text-align: center;">මුදල් බැර කිරීම් ලේඛනය</h2>
        <div id="table-output">දත්ත පූරණය වෙමින් පවතියි...</div>
    </div>

    <div id="lightbox" onclick="this.style.display='none'">
        <span class="close-btn">&times;</span>
        <img id="lb-img">
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000 });

        function toggleSection(id) {
            document.getElementById(id).style.display = 'block';
            document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
        }

        function openLB(src) {
            document.getElementById('lb-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }

        // --- Google Sheet to HTML Table Logic ---
        const sheetID = "https://docs.google.com/spreadsheets/d/1K_VDk7w_u3vB6vj_k1inyBjxjPBT2WWkx296x9bypAg/edit?usp=sharing"; // මෙතනට ඔයාගේ Sheet ID එක දාන්න
        const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetID}/export?format=csv`;

        async function fetchSheetData() {
            toggleSection('finance-view');
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                const rows = data.split('\n');
                
                let html = '<table>';
                rows.forEach((row, index) => {
                    html += '<tr>';
                    const cols = row.split(',');
                    cols.forEach(col => {
                        html += index === 0 ? `<th>${col}</th>` : `<td>${col}</td>`;
                    });
                    html += '</tr>';
                });
                html += '</table>';
                document.getElementById('table-output').innerHTML = html;
            } catch (error) {
                document.getElementById('table-output').innerHTML = "දත්ත ලබා ගැනීමට නොහැකි විය. කරුණාකර 'Publish to Web' කර ඇත්දැයි බලන්න.";
            }
        }
    </script>
</body>
</html>
