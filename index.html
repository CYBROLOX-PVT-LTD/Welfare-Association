```html
<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>සුභසාධන සංගමය 2026</title>

    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        *{
            box-sizing:border-box;
        }

        body {
            margin: 0;
            font-family: 'Poppins', 'Iskoola Pota', sans-serif;
            background: linear-gradient(-45deg, #020024, #090979, #d400ff, #ff0055, #00d2ff);
            background-size: 400% 400%;
            animation: moveGradient 12s ease infinite;
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
        }

        @keyframes moveGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .main-title {
            font-size: clamp(2.5rem, 7vw, 5rem);
            font-weight: 800;
            animation: dropBounce 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            text-shadow: 0 0 30px rgba(255,255,255,0.4);
        }

        @keyframes dropBounce {
            0% {
                transform: translateY(-200px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .options {
            display: flex;
            gap: 30px;
            margin-top: 50px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-card {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(15px);
            padding: 25px 50px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            transition: 0.4s;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            user-select: none;
        }

        .btn-card:hover {
            transform: translateY(-10px) scale(1.05);
            background: rgba(255,255,255,0.25);
            box-shadow: 0 15px 40px rgba(255,0,85,0.4);
        }

        .content-section {
            display: none;
            padding: 50px 20px;
            max-width: 1200px;
            margin: auto;
            animation: slideIn 0.8s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Gallery */

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(280px,1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .gallery-item {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 18px;
            cursor: pointer;
            transition: 0.4s;
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        .gallery-item:hover {
            transform: scale(1.03);
            border-color: #00d2ff;
            box-shadow: 0 15px 40px rgba(0,210,255,0.35);
        }

        /* Finance */

        .table-wrapper {
            background: rgba(0,0,0,0.65);
            border-radius: 20px;
            padding: 20px;
            overflow: auto;
            max-height: 650px;
            backdrop-filter: blur(10px);
        }

        .zoom-controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .zoom-btn {
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .zoom-btn:hover {
            transform: scale(1.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
            transform-origin: top left;
            transition: transform 0.3s ease;
        }

        th, td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        th {
            background: #00d2ff;
            color: black;
            position: sticky;
            top: 0;
        }

        tr:hover td {
            background: rgba(255,255,255,0.06);
        }

        /* Lightbox */

        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(15px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        #lightbox img {
            max-width: 92%;
            max-height: 85%;
            border-radius: 20px;
            border: 3px solid white;
            box-shadow: 0 0 30px rgba(255,255,255,0.3);
        }

        .close-lb {
            position: absolute;
            top: 20px;
            right: 35px;
            font-size: 55px;
            color: white;
            cursor: pointer;
            user-select: none;
        }

        h2{
            text-align:center;
            font-size:2rem;
            margin-bottom:25px;
        }

        @media(max-width:600px){
            .btn-card{
                width:100%;
                text-align:center;
            }

            .main-title{
                font-size:2.7rem;
            }
        }
    </style>
</head>
<body>

    <!-- HERO -->
    <div class="hero">
        <h1 class="main-title">
            සුභසාධන සංගමය 2026
        </h1>

        <div class="options">

            <div class="btn-card"
                 data-aos="fade-right"
                 onclick="showSec('gallery')">
                📷 මීඩියා ගැලරිය
            </div>

            <div class="btn-card"
                 data-aos="fade-left"
                 onclick="loadFinance()">
                💰 මුදල් තොරතුරු
            </div>

        </div>
    </div>

    <!-- GALLERY -->
    <div id="gallery" class="content-section">

        <h2>📷 මීඩියා ගැලරිය</h2>

        <div class="gallery-grid">

            <!-- IMAGE 1 -->
            <img
                src="https://drive.google.com/uc?export=view&id=1pVkLRxM52kC4mw3F6ElgBMlzRQIMwRj1"
                class="gallery-item"
                onclick="openLB(this.getAttribute('src'))"
                alt="Gallery Image 1"
            >

            <!-- IMAGE 2 -->
            <img
                src="https://drive.google.com/uc?export=view&id=1LLM11qiokqMqlWAnaN9dcrjqjEIY36lm"
                class="gallery-item"
                onclick="openLB(this.getAttribute('src'))"
                alt="Gallery Image 2"
            >

        </div>
    </div>

    <!-- FINANCE -->
    <div id="finance" class="content-section">

        <h2>💰 මුදල් බැර කිරීම් ලේඛනය</h2>

        <div class="zoom-controls">
            <button class="zoom-btn" onclick="zoomTable(0.1)">
                Zoom In +
            </button>

            <button class="zoom-btn" onclick="zoomTable(-0.1)">
                Zoom Out -
            </button>

            <button class="zoom-btn" onclick="resetZoom()">
                Reset
            </button>
        </div>

        <div class="table-wrapper">
            <div id="table-data">
                දත්ත පූරණය වෙමින් පවතියි...
            </div>
        </div>

    </div>

    <!-- LIGHTBOX -->
    <div id="lightbox" onclick="closeLB()">

        <span class="close-lb">&times;</span>

        <img id="lb-img">

    </div>

    <!-- AOS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>

        AOS.init();

        // SHOW SECTION

        function showSec(id){

            document.querySelectorAll('.content-section')
            .forEach(sec=>{
                sec.style.display='none';
            });

            const target=document.getElementById(id);

            target.style.display='block';

            target.scrollIntoView({
                behavior:'smooth'
            });
        }

        // LIGHTBOX

        function openLB(src){

            document.getElementById('lb-img').src = src;

            document.getElementById('lightbox').style.display='flex';
        }

        function closeLB(){

            document.getElementById('lightbox').style.display='none';
        }

        // LOAD GOOGLE SHEET

        async function loadFinance(){

            showSec('finance');

            const sheetID =
            "1K_VDk7w_u3vB6vj_k1inyBjxjPBT2WWkx296x9bypAg";

            const csvUrl =
            `https://docs.google.com/spreadsheets/d/${sheetID}/export?format=csv`;

            try{

                const res = await fetch(csvUrl);

                const data = await res.text();

                const rows = data.trim().split('\n');

                let html = '<table id="myTable">';

                rows.forEach((row,index)=>{

                    html += '<tr>';

                    const cols = row.split(',');

                    cols.forEach(col=>{

                        col = col.replace(/"/g,'');

                        if(index===0){
                            html += `<th>${col}</th>`;
                        }else{
                            html += `<td>${col}</td>`;
                        }

                    });

                    html += '</tr>';

                });

                html += '</table>';

                document.getElementById('table-data').innerHTML = html;

            }

            catch(err){

                document.getElementById('table-data').innerHTML =
                "❌ දත්ත ලබා ගැනීමට නොහැකි විය.<br><br>Google Sheet එක 'Publish to web' කර ඇතිද බලන්න.";

                console.error(err);
            }
        }

        // ZOOM TABLE

        let currentScale = 1;

        function zoomTable(value){

            currentScale += value;

            if(currentScale < 0.5){
                currentScale = 0.5;
            }

            document.getElementById('myTable').style.transform =
            `scale(${currentScale})`;
        }

        function resetZoom(){

            currentScale = 1;

            document.getElementById('myTable').style.transform =
            `scale(1)`;
        }

    </script>

</body>
</html>
```
