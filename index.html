<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>සුභසාධන සංගමය 2026</title>
    
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', 'Iskoola Pota', sans-serif;
            background: linear-gradient(-45deg, #020024, #090979, #d400ff, #ff0055, #00d2ff);
            background-size: 400% 400%;
            animation: moveGradient 12s ease infinite;
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
        }

        @keyframes moveGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .main-title {
            font-size: clamp(2.5rem, 7vw, 4.5rem);
            font-weight: 800;
            animation: dropBounce 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        @keyframes dropBounce {
            0% { transform: translateY(-200px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .options {
            display: flex;
            gap: 30px;
            margin-top: 50px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 25px 50px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: 0.4s;
            font-weight: bold;
            font-size: 1.3rem;
        }

        .btn-card:hover {
            transform: translateY(-10px) scale(1.05);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 15px 40px rgba(255, 0, 85, 0.4);
        }

        .content-section {
            display: none;
            padding: 50px 20px;
            max-width: 1200px;
            margin: auto;
            animation: slideIn 1s ease;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }

        /* Gallery Image Styles */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.1);
            transition: 0.3s;
        }

        .gallery-item:hover {
            transform: scale(1.03);
            border-color: #00d2ff;
        }

        /* Table Zooming */
        .table-wrapper {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 20px;
            overflow: auto;
            max-height: 600px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
            transition: transform 0.3s;
            transform-origin: top left;
        }

        th, td { padding: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); text-align: center; }
        th { background: #00d2ff; color: #000; }

        .zoom-controls { margin-bottom: 15px; }

        #lightbox {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(15px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        #lightbox img { max-width: 90%; max-height: 80%; border-radius: 10px; }
        .close-lb { position: absolute; top: 20px; right: 40px; font-size: 50px; cursor: pointer; color: white; }
    </style>
</head>
<body>

    <div class="hero">
        <h1 class="main-title">සුභසාධන සංගමය 2026</h1>
        <div class="options">
            <div class="btn-card" data-aos="fade-right" onclick="showSec('gallery')">📷 මීඩියා ගැලරිය</div>
            <div class="btn-card" data-aos="fade-left" onclick="loadFinance()">💰 මුදල් තොරතුරු</div>
        </div>
    </div>

    <div id="gallery" class="content-section">
        <h2 style="text-align: center;">මීඩියා ගැලරිය</h2>
        <div class="gallery-grid">
            <img src="https://drive.google.com/file/d/1pVkLRxM52kC4mw3F6ElgBMlzRQIMwRj1/view?usp=sharing" class="gallery-item" onclick="openLB(this.src)">
            <img src="https://drive.google.com/file/d/1LLM11qiokqMqlWAnaN9dcrjqjEIY36lm/view?usp=sharing" class="gallery-item" onclick="openLB(this.src)">
        </div>
    </div>

    <div id="finance" class="content-section">
        <h2 style="text-align: center;">මුදල් බැර කිරීම් ලේඛනය</h2>
        <div class="zoom-controls">
            <button onclick="zoomTable(0.1)">Zoom In +</button>
            <button onclick="zoomTable(-0.1)">Zoom Out -</button>
            <button onclick="resetZoom()">Reset</button>
        </div>
        <div class="table-wrapper">
            <div id="table-data">දත්ත පූරණය වෙමින් පවතියි...</div>
        </div>
    </div>

    <div id="lightbox" onclick="closeLB()">
        <span class="close-lb">&times;</span>
        <img id="lb-img">
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();

        function showSec(id) {
            document.querySelectorAll('.content-section').forEach(s => s.style.display = 'none');
            const target = document.getElementById(id);
            target.style.display = 'block';
            target.scrollIntoView({ behavior: 'smooth' });
        }

        function openLB(src) {
            document.getElementById('lb-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }
        function closeLB() { document.getElementById('lightbox').style.display = 'none'; }

        async function loadFinance() {
            showSec('finance');
            const sheetID = "1K_VDk7w_u3vB6vj_k1inyBjxjPBT2WWkx296x9bypAg";
            const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetID}/export?format=csv`;

            try {
                const res = await fetch(csvUrl);
                const data = await res.text();
                const rows = data.split('\n');
                let html = '<table id="myTable">';
                rows.forEach((row, i) => {
                    html += '<tr>';
                    const cols = row.split(',');
                    cols.forEach(col => {
                        html += i === 0 ? `<th>${col}</th>` : `<td>${col}</td>`;
                    });
                    html += '</tr>';
                });
                html += '</table>';
                document.getElementById('table-data').innerHTML = html;
            } catch (err) {
                document.getElementById('table-data').innerHTML = "දත්ත ලබා ගැනීමට නොහැකි විය.";
            }
        }

        let currentScale = 1;
        function zoomTable(val) {
            currentScale += val;
            document.getElementById('myTable').style.transform = `scale(${currentScale})`;
        }
        function resetZoom() {
            currentScale = 1;
            document.getElementById('myTable').style.transform = `scale(1)`;
        }
    </script>
</body>
</html>
